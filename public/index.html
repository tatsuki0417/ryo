<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ryo remote — PC操作</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- ログイン画面 -->
    <section id="login" class="screen">
      <div class="card login-card">
        <div class="logo">🖥️</div>
        <h1>ryo remote</h1>
        <p class="sub">PINを入力してください</p>
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••"
          class="pin-input"
        />
        <button id="loginBtn" class="btn primary">ログイン</button>
        <p id="loginError" class="error" hidden></p>
      </div>
    </section>

    <!-- メイン画面 -->
    <section id="main" class="screen" hidden>
      <header class="topbar">
        <span class="brand">🖥️ ryo remote</span>
        <span id="osBadge" class="badge"></span>
        <button id="logoutBtn" class="btn ghost small">ログアウト</button>
      </header>

      <div class="content">
        <div class="block">
          <h2>📷 カメラ</h2>
          <div id="cameraBox" class="camera-box">
            <img id="cameraImg" alt="カメラ映像" hidden />
            <div id="cameraPlaceholder" class="placeholder">停止中</div>
          </div>
          <div class="camera-controls">
            <button id="cameraToggle" class="btn">▶ 映像を表示</button>
            <button id="snapshotBtn" class="btn ghost">📸 スナップショット</button>
          </div>
          <p id="cameraMsg" class="hint"></p>
        </div>

        <div class="block">
          <h2>⚡ 電源操作</h2>
          <div id="actions" class="actions-grid"></div>
        </div>
      </div>

      <div id="toast" class="toast" hidden></div>

      <!-- 確認ダイアログ -->
      <div id="confirm" class="modal" hidden>
        <div class="modal-card">
          <div id="confirmIcon" class="modal-icon"></div>
          <p id="confirmText"></p>
          <div class="modal-btns">
            <button id="confirmCancel" class="btn ghost">キャンセル</button>
            <button id="confirmOk" class="btn danger">実行する</button>
          </div>
        </div>
      </div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
