# チケットトレード監視の定期実行
#
# 費用: GitHub Actions の無料枠で動きます
#   - パブリックリポジトリ: 無制限で無料
#   - プライベートリポジトリ: 月2,000分無料 (30分おき×1分/回 ≒ 月1,450分で枠内)
#
# 必要な設定 (リポジトリの Settings → Secrets and variables → Actions):
#   - X_BEARER_TOKEN: X API v2 の Bearer Token（未設定だとモックモードで動く）
name: ticket-watch

on:
  schedule:
    - cron: "*/30 * * * *" # 30分おき (UTC)
  workflow_dispatch: {} # 手動実行ボタンも有効化

permissions:
  contents: write # state.json のコミット用
  issues: write # 通知 Issue の作成用

concurrency:
  group: ticket-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m ticket_watch.main
        working-directory: src

      - name: Persist state
        run: |
          git config user.name "ticket-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update watch state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
