# チケットトレード監視の設定ファイル
#
# ここに「探したい公演」と「検索キーワード」を書きます。
# 変更したら git push するだけで次回の定期実行から反映されます。

# --- 検索クエリ ---
# X (旧Twitter) の検索にそのまま使われます。
# 「譲」を含む投稿 = 相手が譲りたい → 自分が欲しいチケットを探すのに使う
# 転売防止のため -給 -高額 などの除外語も入れられます。
searches:
  - label: "サンプル公演の譲渡を探す"
    query: '"サンプルアーティスト" 譲 定価 -RT'
    # この検索で見つけたいもの（マッチング条件）
    want:
      type: "譲"          # 相手の投稿種別: 譲 (相手が譲る) / 求 (相手が求めている)
      keywords:            # 本文にすべて含まれていてほしい語（空なら本文チェックなし）
        - "サンプルアーティスト"
      exclude_keywords:    # 1つでも含まれていたら除外する語
        - "高額"
      max_tickets: 2       # 枚数がパースできた場合、この枚数以下のみ通知（0 = 無制限）

# --- 連絡文の下書きテンプレート ---
# 通知に添付される返信下書き。{artist} などは検索の label が入ります。
draft_template: |
  はじめまして。ツイートを拝見してご連絡いたしました。
  こちらのチケットをお譲りいただくことは可能でしょうか。
  定価+振込手数料にてお願いできればと思っております。
  お取引方法などご相談させてください。よろしくお願いいたします。

# --- 通知方法 ---
notify:
  # github_issue: GitHub Actions 上で実行時、このリポジトリに Issue を作成して通知
  #   （GitHub モバイルアプリを入れておけばプッシュ通知が届く。追加費用ゼロ）
  github_issue: true
  # console: 標準出力に表示（ローカル実行・デバッグ用）
  console: true

# --- 安全設定 ---
safety:
  # 高額転売と思われる投稿を自動で除外するキーワード
  resale_filter:
    - "定価以上"
    - "良席のため"
    - "プレミア"
  # 1回の実行で通知する最大件数（暴走防止）
  max_notifications_per_run: 5
