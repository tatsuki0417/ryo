<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイホムペ ― レトロ個人ホームページ製作所</title>
  <meta name="description" content="スマホで数分で作れる、2000年代風のなつかしい自分だけのホームページ。工事中GIF・アクセスカウンター・BGM付き。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ヘッダー -->
  <header class="app-header">
    <div class="app-logo">🏠 マイホムペ</div>
    <div class="app-tag">なつかしの「自分のホームページ」を、いま作ろう</div>
  </header>

  <!-- 閲覧モード時だけ出る：自分も作る導線 -->
  <div class="view-cta">
    <button id="btn-make-own" class="cta-btn">＋ 自分もホムペを作る</button>
  </div>

  <main class="layout">
    <!-- 編集パネル（編集モードのみ表示） -->
    <section class="editor" id="editor">
      <h2 class="editor-title">✏️ ホムペをつくる</h2>

      <label class="field">
        <span>サイト名</span>
        <input id="in-siteName" type="text" maxlength="40" />
      </label>

      <div class="field">
        <span>タイトルの装飾</span>
        <div id="title-chips" class="chips"></div>
      </div>

      <div class="field">
        <span>背景テーマ</span>
        <div id="theme-chips" class="chips"></div>
      </div>

      <div class="field">
        <span>プロフィール画像（プリ画像）</span>
        <input id="in-avatar" type="file" accept="image/*" />
        <div class="avatar-frame-row">
          <span class="mini-label">飾り枠：</span>
          <div id="frame-chips" class="chips"></div>
        </div>
        <button id="btn-avatar-remove" type="button" class="mini-btn">画像を消す</button>
      </div>

      <label class="field">
        <span>管理人のなまえ</span>
        <input id="in-ownerName" type="text" maxlength="16" />
      </label>

      <label class="field">
        <span>ひとこと</span>
        <input id="in-hitokoto" type="text" maxlength="40" />
      </label>

      <label class="field">
        <span>じこしょうかい</span>
        <textarea id="in-bio" rows="4" maxlength="300"></textarea>
      </label>

      <label class="field">
        <span>更新履歴（What's New）</span>
        <textarea id="in-news" rows="3" maxlength="300"></textarea>
      </label>

      <label class="field">
        <span>流れる文字（マーキー）</span>
        <input id="in-marquee" type="text" maxlength="80" />
      </label>

      <div class="field">
        <span>リンク（相互リンクなど）</span>
        <input id="in-link1-title" type="text" placeholder="リンクの名前" maxlength="24" />
        <input id="in-link1-url" type="url" placeholder="https://（空でもOK）" />
      </div>

      <div class="field">
        <span>パーツ（組み合わせて自分だけのホムペに！）</span>
        <label class="check"><input id="pt-construction" type="checkbox" /> 🚧 工事中バナー</label>
        <label class="check"><input id="pt-counter" type="checkbox" /> 🔢 アクセスカウンター</label>
        <label class="check"><input id="pt-guestbook" type="checkbox" /> 📖 訪問者ノート</label>
        <label class="check"><input id="pt-fortune" type="checkbox" /> 🔮 きょうの運勢</label>
        <label class="check"><input id="pt-clap" type="checkbox" /> 👏 Web拍手</label>
        <label class="check"><input id="pt-news" type="checkbox" /> 📢 更新履歴</label>
        <label class="check"><input id="pt-sparkle" type="checkbox" /> ✨ キラキラ追従カーソル</label>
      </div>
    </section>

    <!-- プレビュー（＝できあがるホムペ本体。両モードで表示） -->
    <section class="preview-wrap">
      <div class="preview-label">▼ プレビュー ▼</div>
      <div id="preview" class="homepage"></div>
    </section>
  </main>

  <!-- 下部アクションバー -->
  <div class="action-bar">
    <button id="btn-bgm" class="act">♪ BGM</button>
    <button id="btn-share-url" class="act primary">🔗 URLをコピー</button>
    <button id="btn-share-banner" class="act">📷 バナー保存</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
